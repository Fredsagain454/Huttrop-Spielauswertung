<!doctype html>
<html lang="de"><head><meta charset="utf-8">

<title>Spielauswertung</title>
<style>
:root{--bg:#f6f7f9;--fg:#15181d;--card:#fff;--line:#c9cfd8;--calc:#cfe3fb;--pos:#1b7f3b;--neg:#b3261e;--acc:#1d4ed8;--accfg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--fg:#e8eaee;--card:#1e232b;--line:#3a424e;--calc:#223a5c;--pos:#5ccf80;--neg:#ff8a80;--acc:#6ea0ff;--accfg:#0c1220}}
:root[data-theme="dark"]{--bg:#14171c;--fg:#e8eaee;--card:#1e232b;--line:#3a424e;--calc:#223a5c;--pos:#5ccf80;--neg:#ff8a80;--acc:#6ea0ff;--accfg:#0c1220}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px Arial,Helvetica,sans-serif;-webkit-user-select:none;user-select:none}
#app{padding:10px;max-width:100%}
.hd{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
label{display:flex;flex-direction:column;font-size:12px;font-weight:bold;gap:2px}
input,textarea,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px;-webkit-user-select:text;user-select:text;min-width:0}
input:disabled,textarea:disabled{opacity:.75}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
button{font:inherit;font-weight:bold;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:10px 14px;min-height:44px}
button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
button.warn{background:var(--neg);border-color:var(--neg);color:#fff}
button.pri{background:var(--pos);border-color:var(--pos);color:#fff}
.sp{flex:1}
.hint{font-size:12px;opacity:.75;margin:4px 0 8px}
.ban{background:var(--calc);border-radius:8px;padding:8px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-weight:bold}
.ban span{flex:1;min-width:200px}
.wrap{border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;table-layout:fixed}
col.nr{width:40px}col.nm{width:12%}
th,td{border:1px solid var(--line);text-align:center;padding:0;overflow:hidden}
th{font-size:clamp(9px,1vw,12px);padding:5px 2px;background:var(--bg);vertical-align:bottom;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;position:sticky;top:0;z-index:2}
th.p{color:var(--pos)}th.n{color:var(--neg)}th.calc{background:var(--calc)}
td.c{padding:3px}
.cc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:3px}
.cc button{width:100%;min-width:0;min-height:0;padding:0;line-height:1;border-radius:7px}
.cc button.pl{grid-column:1/3;height:40px;font-size:24px;background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.cc button.mi{height:30px;font-size:20px;color:var(--neg)}
.cc b{display:flex;align-items:center;justify-content:center;font-size:clamp(14px,1.6vw,20px)}
.cc button:active{opacity:.6}
td.ro{font-size:clamp(14px,1.6vw,18px);font-weight:bold;height:40px}
td.calc{background:var(--calc);font-weight:bold;font-size:clamp(12px,1.3vw,16px)}
td.nm{text-align:left;padding:0 6px;font-size:clamp(12px,1.2vw,15px)}
td.nr{font-size:13px;font-weight:bold}
tr.tot td{background:var(--bg);font-weight:bold;height:40px}
tr.tot td.calc{background:var(--calc)}
td.empty{padding:20px;text-align:center;opacity:.8}
.st th{font-size:clamp(8px,.95vw,12px)}
.st td{height:36px;font-size:clamp(11px,1.15vw,14px)}
.st td.nm{font-weight:bold}
.add{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.add input{flex:1;min-width:160px}.add input.n{flex:0 0 80px;min-width:80px}
.kt td{padding:4px;height:52px}
.kt td input,.kt td select{width:100%}
.kt input[type=checkbox]{width:28px;height:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card .ti{flex:1;min-width:240px}
.card .ti b{display:block;font-size:16px}
.card .ti small{opacity:.75}
h3{margin:14px 0 6px;font-size:16px}
textarea{width:100%;min-height:300px}
.score{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.score .sc{font-size:clamp(18px,2.2vw,26px);font-weight:bold;white-space:nowrap}
.score .sc b{font-size:1.25em;margin:0 6px}
.score small{opacity:.75;white-space:nowrap}
.seg{display:inline-flex}.seg button{border-radius:0;min-width:64px}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button+button{margin-left:-1px}
button:disabled{opacity:.4}
.lbl{font-size:12px;font-weight:bold;opacity:.75}
.gkq{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.gkq button small{font-weight:normal;opacity:.75}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;font-weight:bold;max-width:90vw;text-align:center}
#toast.on{opacity:1}

.score{position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.last{font-size:14px;font-weight:bold;opacity:.85}
h3{margin:14px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;min-height:100px;display:flex;flex-direction:column;gap:3px;font:inherit;color:var(--fg);font-weight:normal}
.tile:active{background:var(--calc)}
.tile .tn{font-size:clamp(16px,1.6vw,20px);font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tn span{display:inline-block;min-width:30px;color:var(--acc);margin-right:6px}
.tile .ts{font-size:13px;opacity:.8}
.tile .wn{font-size:13px;font-weight:bold;color:var(--neg)}
.tile.gk{border:2px solid var(--acc);padding:0;gap:0}
.tile .tg{background:transparent;border:0;text-align:left;display:flex;flex-direction:column;gap:3px;padding:10px 12px 6px;min-height:0;font-weight:normal;color:var(--fg)}
.tiles.gks{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tile .qk{display:flex;gap:6px;padding:0 8px 8px}.tile .qk button{flex:1;min-width:0;min-height:52px;padding:6px 4px;white-space:nowrap;font-size:15px}
.go.pos{background:var(--pos);border-color:var(--pos);color:#fff}
.go.neg{background:var(--neg);border-color:var(--neg);color:#fff}
.go.neu{background:var(--card);color:var(--fg)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;z-index:30;padding:16px 10px;overflow:auto}
.ov[hidden]{display:none}
.sheet{background:var(--bg);border-radius:14px;width:100%;max-width:1000px;padding:14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:4px}.sh h2{margin:0;font-size:24px;flex:1}.sh h2 span{color:var(--acc)}
.x{min-width:52px;font-size:20px}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.ab{display:flex}
.agbr{grid-column:1/-1;height:2px}
.ab .go{flex:1;min-width:0;min-height:64px;border-radius:10px 0 0 10px;font-size:17px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ab .go span{min-width:0;overflow-wrap:break-word;hyphens:manual;-webkit-hyphens:manual}
.ab .go b{flex:0 0 auto;background:rgba(0,0,0,.18);border-radius:999px;padding:2px 10px;min-width:36px;text-align:center}
.ab .go.neu b{background:var(--bg)}
.ab .dn{flex:0 0 48px;width:48px;border-radius:0 10px 10px 0;margin-left:-1px;font-size:22px;color:var(--neg);padding:0}
.mn{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:8px}.mn button{min-height:60px;font-size:17px}
.sheet .hd{margin-top:8px}
.mob{display:none}
.navm{display:contents}
@media (max-width:600px){
  .dsk{display:none}.mob{display:inline}
  body{font-size:14px}
  #app{padding:8px 8px 84px}
  .hint{display:none}
  .navm{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;gap:4px;background:var(--card);border-top:1px solid var(--line);
        padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .navm button{flex:1;min-height:52px;padding:6px 4px;font-size:15px}
  #bar>button{padding:8px 12px}
  .score{padding:6px 8px;gap:6px}
  .score .sc{font-size:18px;flex-basis:100%}
  .score .seg button{min-width:52px;padding:8px 10px}
  .score .gkq{padding-top:6px}
  .score .last{font-size:12px}
  .og-row{display:none}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .tiles.gks{grid-template-columns:1fr}
  .tile{min-height:84px;padding:8px 10px}
  .tile .tn{font-size:17px}.tile .ts{font-size:12px}
  .ov{padding:0;align-items:stretch}
  .sheet{border-radius:0;min-height:100%;padding:10px}
  .sh h2{font-size:20px}
  .ag{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .ab .go{min-height:56px;font-size:14px;padding:6px 8px}
  .ab .go b{min-width:28px;padding:2px 6px}
  .ab .dn{flex:0 0 38px;width:38px;font-size:20px}
  .mn{grid-template-columns:1fr}
  .seg button{min-width:0}
  .kt col.k1{width:40px!important}.kt col.k2{width:52px!important}.kt col.k4{width:92px!important}.kt col.k5{width:48px!important}
  .kt td{padding:3px}.kt td input,.kt td select{padding:6px 4px}.kt td button{padding:6px 4px;width:100%}
  #toast{bottom:90px}
}
.qrbox{display:flex;justify-content:center;background:#fff;border-radius:12px;padding:10px;margin:8px auto;max-width:520px}
.qr{width:100%;max-width:min(480px,62vh);height:auto;display:block}
.qrv{width:100%;max-height:58vh;border-radius:8px;background:#000;display:block}
.ctr{text-align:center}
#qtx{min-height:70px;width:100%}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.rolebtn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-height:110px;padding:14px;border-radius:12px;font-weight:normal}
.rolebtn b{font-size:20px}.rolebtn span{font-size:14px;opacity:.85}
.rolebtn.on span{opacity:1}
.ok{color:var(--pos);font-weight:bold}
.ftx{min-height:120px;font-size:16px;line-height:1.5;width:100%}
.rtx{min-height:220px;font-size:16px;line-height:1.5}
.ban.warnb{background:#fde7c7;color:#5a3a00}
th.hl,td.hl{background:#ffe2b0;color:#3a2a00}
td.hl.hlx{background:#ffbf5c;font-weight:bold}
tr.tot td.hl{background:#ffd48a}
.spx{background:#fff3df;border:2px solid #f0a53a;border-radius:10px;padding:8px 12px;margin-bottom:8px;color:#3a2a00}
.spx b{display:block;margin-bottom:4px}
.spx div{display:flex;gap:8px;padding:2px 0;font-size:15px}.spx div span{font-weight:bold;min-width:170px}
.spx .sp-rk span{color:#b3261e}.spx .sp-bk span{color:#1d4ed8}.spx .sp-30 span{color:#1b7f3b}
.cards2{display:flex;gap:4px;flex-wrap:wrap}.ck{font-size:12px;font-weight:bold;border-radius:4px;padding:1px 6px;color:#fff}
.ck.red{background:#d32f2f}.ck.blue{background:#1d4ed8}
@media (max-width:600px){.spx div{flex-direction:column;gap:0}.spx div span{min-width:0}}
.cards{display:flex;flex-direction:column;gap:6px}
details.pc{background:var(--card);border:1px solid var(--line);border-radius:10px}
details.pc.tot{background:var(--calc)}
details.pc summary{list-style:none;padding:10px 12px;display:flex;flex-direction:column;gap:3px;cursor:pointer}
details.pc summary::-webkit-details-marker{display:none}
.pc .pn{font-weight:bold;font-size:16px}.pc .pn span{color:var(--acc);display:inline-block;min-width:28px}
.pc .pv{font-size:13px;opacity:.85}
.pc .pv::after{content:' ▸';opacity:.6}
details.pc[open] .pv::after{content:' ▾'}
.pd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;padding:0 12px 10px;font-size:13px}
.pd div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:3px 0}
.pd div b{margin-left:8px}
</style></head><body>
<div id="app">
<div class="bar" id="bar"></div>
<div class="hint" id="hint"></div>
<div id="tbl"></div>
<input type="file" id="imp" multiple style="display:none">
<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>
</div>
<div id="toast"></div>
<script>
// ---------- Grundlagen ----------
const SH='­';
const q=(a,b)=>b?Math.round(a/b*100)+'%':'–';
const v=(o,k)=>(o&&o[k])||0;
const avg=(x,n)=>n?(x/n).toFixed(1).replace('.',','):'–';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const angr=o=>v(o,'as')+v(o,'h7')+v(o,'e1')+v(o,'h2')-v(o,'tf')-v(o,'pf')-v(o,'gv');
const abw=o=>v(o,'st')+v(o,'pe')+v(o,'bl')-v(o,'z2')-v(o,'v7')-v(o,'v1');
const SEC={
a:{t:'Angriff',cols:[
{k:'w',l:'Würfe'},{k:'t',l:'Tore',also:'w'},{l:`Wurf${SH}quote gesamt`,f:o=>q(v(o,'t'),v(o,'w'))},
{k:'w7',l:'7m Würfe'},{k:'t7',l:'7m Tore',also:'w7'},{l:`7m Wurf${SH}quote`,f:o=>q(v(o,'t7'),v(o,'w7'))},
{k:'gv',l:`Gegen${SH}stoß verworfen (−)`,s:'n',hl:1},
{k:'as',l:'Assists (+)',s:'p'},{k:'tf',l:`Tech${SH}nische Fehler (−)`,s:'n'},{k:'pf',l:`Pass- & Fang${SH}fehler (−)`,s:'n'},
{k:'h7',l:`7m heraus${SH}geholt (+)`,s:'p'},{k:'e1',l:`1:1 Aktion gewon${SH}nen (+)`,s:'p'},{k:'h2',l:`2 Min heraus${SH}geholt (+)`,s:'p'},
{l:`Angriffs${SH}leistung (+/−)`,f:angr}]},
d:{t:'Abwehr',cols:[
{k:'st',l:`Steals, abge${SH}fangene Bälle (+)`,s:'p'},{k:'pe',l:`Tech${SH}nische Fehler provo${SH}ziert (+)`,s:'p'},{k:'bl',l:'Geblockte Bälle (+)',s:'p'},
{k:'z2',l:'2 Min erhalten (−)',s:'n'},{k:'v7',l:'7m verursacht (−)',s:'n'},{k:'v1',l:'1:1 Aktion verloren (−)',s:'n'},
{k:'rk',l:'Rote Karte',hl:1},{k:'bk',l:'Blaue Karte',hl:1},
{l:`Abwehr${SH}leistung (+/−)`,f:abw}]},
g:{t:'Torhüter',cols:[
{k:'h',l:'Gehaltene Würfe'},{k:'g',l:`Gegen${SH}treffer`},{l:'Abwehr-Quote',f:o=>q(v(o,'h'),v(o,'h')+v(o,'g'))},
{k:'s7',l:'7m'},{k:'h7',l:'7m gehalten',also:'s7'},{l:'7m-Quote',f:o=>q(v(o,'h7'),v(o,'s7'))},
{k:'as',l:'Assist'},{k:'fp',l:'Fehlpässe'}]}};
const LK=s=>s==='g'?'gk':'fp';

// ---------- Zustand ----------
const TEAM='Winfried Huttrop II';                  // eigene Mannschaft – wird bei jedem neuen Spiel als Heim eingetragen
const newGame=(fp,gk)=>({id:uid(),h:{heim:TEAM},notes:'',fp:[...(fp||[])],gk:[...(gk||[])],a:{},d:{},g:{},x:{},h2:{},half:1});
const fresh=()=>({kader:[],cur:newGame(),archiv:[],tab:'kader',view:null,season:'alle',hf:'all',undo:[],autoB:null});
let S=fresh();
(function load(){
  let r=null;try{r=localStorage.getItem('sa2')}catch(e){}
  if(r){try{S=Object.assign(fresh(),JSON.parse(r))}catch(e){}return}
  let o=null;try{o=JSON.parse(localStorage.getItem('sa1')||'null')}catch(e){}
  if(!o)return;                                   // Übernahme aus Version 1
  const has=x=>x&&Object.values(x).some(n=>n>0);
  (o.names||[]).forEach((n,i)=>{const a=(o.a||[])[i],d=(o.d||[])[i];
    if(!n&&!has(a)&&!has(d))return;const id=uid();
    S.kader.push({id,name:n||'Spieler '+(i+1),nr:'',r:'f'});S.cur.fp.push(id);S.cur.a[id]=a||{};S.cur.d[id]=d||{}});
  (o.gn||[]).forEach((n,i)=>{const g=(o.g||[])[i];if(!n&&!has(g))return;const id=uid();
    S.kader.push({id,name:n||'Torhüter '+(i+1),nr:'',r:'g'});S.cur.gk.push(id);S.cur.g[id]=g||{}});
  S.cur.h=o.h||{};S.cur.notes=o.notes||'';if(S.kader.length)S.tab='a';save();
})();
function save(){try{localStorage.setItem('sa2',JSON.stringify(S))}catch(e){}}
const G=()=>(S.view&&S.archiv.find(x=>x.id===S.view))||S.cur;
const ro=()=>!!(S.view&&S.archiv.find(x=>x.id===S.view));
const kp=id=>S.kader.find(p=>p.id===id);
const pn=(g,id)=>{const p=kp(id);return p?p.name:(g.players&&g.players[id]?g.players[id].name:'?')};
const pnr=(g,id)=>{const p=kp(id);return p?p.nr:(g.players&&g.players[id]?g.players[id].nr:'')};
const nrSort=(a,b)=>{const x=parseInt(a.nr),y=parseInt(b.nr);
  if(isNaN(x)!==isNaN(y))return isNaN(x)?1:-1;if(!isNaN(x)&&x!==y)return x-y;return String(a.name).localeCompare(String(b.name),'de')};
const lineup=(g,key)=>g[key].map(id=>({id,name:pn(g,id),nr:pnr(g,id)})).sort(nrSort);
const hasData=g=>['a','d','g','x'].some(s=>Object.values(g[s]||{}).some(o=>Object.values(o||{}).some(n=>n>0)))
  ||Object.entries(g.h||{}).some(([k,x])=>x&&!(k==='heim'&&x===TEAM))||!!g.notes;
// Halbzeiten: g[sec] = gesamt, g.h2[sec] = Anteil 2. Halbzeit, 1. HZ = gesamt − 2. HZ
const pobj=(g,sec,pid,hf)=>{const t=((g[sec]||{})[pid])||{};if(!hf||hf==='all')return t;
  const two=(((g.h2||{})[sec]||{})[pid])||{},o={};for(const k in t)o[k]=hf==='2'?(two[k]||0):Math.max(0,(t[k]||0)-(two[k]||0));return o};
function score(g,hf){let own=0,opp=0;
  g.fp.forEach(id=>{const o=pobj(g,'a',id,hf);own+=v(o,'t')+v(o,'t7')});
  g.gk.forEach(id=>{const o=pobj(g,'g',id,hf);opp+=v(o,'g')+Math.max(0,v(o,'s7')-v(o,'h7'))});
  opp+=v(pobj(g,'x','og',hf),'n');return[own,opp]}
const hasH2=g=>(g.half||1)===2||Object.values(g.h2||{}).some(S_=>Object.values(S_||{}).some(o=>Object.values(o||{}).some(n=>n>0)));
const gDate=g=>g.h&&g.h.datum?g.h.datum:new Date(g.savedAt||Date.now()).toISOString().slice(0,10);

function genReport(g){
  const own=g.h.heim||'Unsere Mannschaft',opp=g.h.gast||'den Gegner',sum=(sec,ids,k,hf)=>ids.reduce((t,id)=>t+v(pobj(g,sec,id,hf||'all'),k),0);

  const parse=x=>{const m=String(x||'').match(/^\s*(\d+)\s*[:\-]\s*(\d+)\s*$/);return m?[+m[1],+m[2]]:null};
  const S1=[];
  // Ergebnis: eingetragenes Ergebnis hat Vorrang, sonst erfasster Stand
  const fin=parse(g.h.erg)||score(g,'all'),[o1,o2]=fin,d=o1-o2;
  if(o1+o2===0)return 'Für dieses Spiel wurden noch keine Tore erfasst.';
  if(d>0)S1.push(`${own} gewinnt gegen ${opp} ${d>=8?'deutlich ':d===1?'knapp ':''}mit ${o1}:${o2}.`);
  else if(d<0)S1.push(`${own} verliert gegen ${opp} ${-d>=8?'deutlich ':d===-1?'knapp ':''}mit ${o1}:${o2}.`);
  else S1.push(`${own} und ${opp} trennen sich ${o1}:${o2} unentschieden.`);
  // Halbzeiten
  const h2data=Object.values(g.h2||{}).some(T=>Object.values(T||{}).some(o=>Object.values(o||{}).some(n=>n>0)));
  const hz=parse(g.h.hz)||(h2data?score(g,'1'):null);
  if(hz){const [a,b]=hz,s2=[o1-a,o2-b],lead=x=>Math.sign(x[0]-x[1]);
    let t=`Zur Pause stand es ${a}:${b}`;
    if(lead(hz)!==lead(fin)&&lead(fin)!==0)t+=lead(fin)>0?', nach der Pause drehte die Mannschaft das Spiel':', nach der Pause gab die Mannschaft die Führung noch aus der Hand';
    else if(lead(hz)>0&&lead(fin)>0&&(o1-o2)>(a-b))t+=', in der zweiten Halbzeit wurde der Vorsprung ausgebaut';
    else if(lead(hz)<0&&lead(fin)<0&&(o2-o1)>(b-a))t+=', in der zweiten Halbzeit wurde der Rückstand größer';
    if(s2[0]>=0&&s2[1]>=0)t+=` (2. Halbzeit ${s2[0]}:${s2[1]})`;
    S1.push(t+'.')}
  // Würfe
  const F=g.fp,t=sum('a',F,'t'),w=sum('a',F,'w'),t7=sum('a',F,'t7'),w7=sum('a',F,'w7');
  if(w+w7){let x=`Die Wurfquote lag bei ${pc(t+t7,w+w7)} (${t+t7} ${pl(t+t7,'Tor','Tore')} bei ${w+w7} ${pl(w+w7,'Wurf','Würfen')})`;
    if(w7)x+=`, vom 7-Meter-Punkt trafen wir ${t7} von ${w7}`;S1.push(x+'.')}
  // Werfer
  const sc=F.map(id=>{const o=pobj(g,'a',id,'all');return{id,g:v(o,'t')+v(o,'t7'),w:v(o,'w')+v(o,'w7')}}).filter(x=>x.g>0).sort((a,b)=>b.g-a.g||a.w-b.w);
  if(sc.length){let x=`Die meisten Tore erzielte ${who(sc[0].id)}: ${sc[0].g} bei ${sc[0].w} ${pl(sc[0].w,'Wurf','Würfen')}`;
    const more=sc.slice(1,3).filter(s=>s.g>=2);
    if(more.length)x+=`, dahinter ${more.map(s=>`${who(s.id)} mit ${s.g}`).join(' und ')}`;S1.push(x+'.')}
  {const g30=goal30(g);if(g30&&!g30.unknown)S1.push(`Das 30. Tor erzielte ${who(g30.pid)}${g30.k==='t7'?' per Siebenmeter':''}.`)}
  {const gv=sum('a',F,'gv');if(gv)S1.push(`${gv} ${pl(gv,'Gegenstoß wurde','Gegenstöße wurden')} vergeben.`)}
  // Vorlagen
  const asl=F.map(id=>({id,n:v(pobj(g,'a',id,'all'),'as')})).sort((a,b)=>b.n-a.n);
  if(asl.length&&asl[0].n>=2)S1.push(`Die meisten Vorlagen gab ${who(asl[0].id)} mit ${asl[0].n} Assists.`);
  // Torhüter
  const K=g.gk.map(id=>{const o=pobj(g,'g',id,'all');return{id,h:v(o,'h'),gg:v(o,'g'),h7:v(o,'h7'),s7:v(o,'s7')}}).filter(k=>k.h+k.gg+k.s7>0);
  if(K.length){S1.push((K.length===1?'Im Tor: ':'Im Tor: ')+K.map(k=>`${who(k.id)} mit ${k.h} ${pl(k.h,'Parade','Paraden')} (Quote ${pc(k.h,k.h+k.gg)})`).join(', ')+'.');
    const h7=K.reduce((s,k)=>s+k.h7,0),s7=K.reduce((s,k)=>s+k.s7,0);if(h7)S1.push(`Dazu ${h7===1?'wurde ein Siebenmeter':'wurden '+h7+' Siebenmeter'} gehalten (von ${s7}).`)}
  // Fehler
  const tf=sum('a',F,'tf'),pf=sum('a',F,'pf'),fe=tf+pf;
  if(fe){let x=fe>=8?`Auffällig viele Ballverluste: ${fe} Fehler`:`Ballverluste: ${fe} Fehler`;
    x+=` (${tf} technische, ${pf} Pass-/Fangfehler)`;
    if(h2data){const f2=sum('a',F,'tf','2')+sum('a',F,'pf','2'),f1=fe-f2;if(fe>=4&&f2>=fe*0.65)x+=`, davon ${f2} in der zweiten Halbzeit`;else if(fe>=4&&f1>=fe*0.65)x+=`, davon ${f1} in der ersten Halbzeit`}
    S1.push(x+'.')}
  // Abwehr, Zeitstrafen
  const st=sum('d',F,'st'),bl=sum('d',F,'bl'),z2=sum('d',F,'z2'),v7=sum('d',F,'v7');
  const ab_=[];if(st)ab_.push(`${st} ${pl(st,'Ballgewinn','Ballgewinne')}`);if(bl)ab_.push(`${bl} ${pl(bl,'geblockter Ball','geblockte Bälle')}`);
  if(ab_.length)S1.push(`In der Abwehr gab es ${ab_.join(' und ')}${v7?`, verursacht wurden ${v7} ${pl(v7,'Siebenmeter','Siebenmeter')}`:''}.`);
  if(z2){const red=F.filter(id=>v(pobj(g,'d',id,'all'),'z2')>=3);
    S1.push(`${z2} ${pl(z2,'Zeitstrafe','Zeitstrafen')}${red.length?`, ${red.map(who).join(' und ')} ${red.length===1?'sah':'sahen'} nach drei Zeitstrafen Rot`:''}.`)}
  {const rk=F.filter(id=>v(pobj(g,'d',id,'all'),'rk')),bk=F.filter(id=>v(pobj(g,'d',id,'all'),'bk'));
    if(rk.length)S1.push(`Die Rote Karte sah ${rk.map(who).join(' und ')}${bk.length?`, die Blaue Karte ${bk.map(who).join(' und ')}`:''}.`);
    else if(bk.length)S1.push(`Die Blaue Karte sah ${bk.map(who).join(' und ')}.`)}
  // Beste Gesamtleistung
  const best=F.map(id=>({id,n:angr(pobj(g,'a',id,'all'))+abw(pobj(g,'d',id,'all'))})).sort((a,b)=>b.n-a.n)[0];
  if(best&&best.n>=3)S1.push(`Die beste Gesamtbewertung (Angriff + Abwehr) erreichte ${who(best.id)} mit ${sgn(best.n)}.`);
  return S1.join(' ');
}

      +(!['n','r'].includes(sub)?`<span class="lbl">Ansicht</span>${segB('hf',S.hf||'all',[['all','Gesamt'],['1','1. HZ'],['2','2. HZ']])}`:'')
      +`<span class="sp"></span><button data-act="${r?'hpdf':'pdf'}" data-id="${g.id}">PDF exportieren</button></div>`;
    if(sub==='r'){const ed=!!g.berichtEdit,stale=ed&&g.berichtBase!=null&&g.berichtBase!==genReport(g);
      T.innerHTML=h+(stale?`<div class="ban warnb"><span>Die Zahlen haben sich geändert, seit du den Bericht bearbeitet hast. „Neu erzeugen“ übernimmt die aktuellen Zahlen (dein eigener Text geht dabei verloren).</span></div>`:'')+`<div class="bar"><span class="lbl">${ed?'Von Hand bearbeitet':'Automatisch aus den Zahlen erzeugt'+(r?'':' – passt sich beim Erfassen laufend an')}</span><span class="sp"></span>`
        +`${ed?ab('regen','Neu erzeugen','Eigenen Text ersetzen?','regen'):''}<button data-act="rshare">Bericht teilen</button></div>`
        +`<textarea id="rtx" class="rtx"></textarea><p class="hint" style="display:block">Du kannst den Text frei ändern oder ergänzen. Er wird mit dem Spiel gespeichert, im PDF auf Seite 1 gedruckt und beim Senden an den Trainer mitgeschickt.</p>`
        +`<h3>Fazit des Trainers</h3><textarea id="ftx" class="ftx" placeholder="Kurzes Fazit zum Spiel …"></textarea>`
        +`<p class="hint" style="display:block">🎤 Tipp: In das Feld tippen und auf der Tastatur das Mikrofon antippen – dann einfach sprechen. Das Fazit erscheint als eigener Absatz im Bericht, im PDF, beim Teilen und Senden.</p>`;
      const fx=document.getElementById('ftx');fx.value=g.fazit||'';
      fx.oninput=()=>{const tg=ro()?G():S.cur;tg.fazit=fx.value;if(!tg.fazitVon&&S.user)tg.fazitVon=S.user;if(ro())tg.savedAt=Date.now();save()};
      const x=document.getElementById('rtx');x.value=reportOf(g);
      x.oninput=()=>{const tg=ro()?G():S.cur;if(!tg.berichtEdit)tg.berichtBase=genReport(tg);tg.bericht=x.value;tg.berichtEdit=true;if(ro())tg.savedAt=Date.now();save()};return}
    if(sub==='n'){T.innerHTML=h+'<textarea id="nt" placeholder="Notizen zum Spiel …"></textarea>';const x=document.getElementById('nt');x.value=g.notes||'';x.disabled=r;
      x.oninput=()=>{if(ro())return;S.cur.notes=x.value;save()};return}
    T.innerHTML=h+(isPhone()?cardsFrom(statRows(sub,g,S.hf||'all'),SUM[sub]):statTable(sub,g,false));return}
  if(t==='kader')return drawKader(T);
  if(t==='hist')return drawHist(T);

function statTable(sec,g,edit){
  const hf=S.hf||'all',cols=SEC[sec].cols,ps=lineup(g,LK(sec)),tot={},P_=id=>pobj(g,sec,id,hf);
  if(hf!=='all')edit=false;
  ps.forEach(p=>cols.forEach(c=>{if(c.k)tot[c.k]=(tot[c.k]||0)+v(P_(p.id),c.k)}));
  const cg=`<colgroup><col class="nr"><col class="nm">${cols.map(()=>'<col>').join('')}</colgroup>`;
  const hd=`<tr><th>Nr</th><th>Spieler</th>${cols.map(c=>`<th class="${c.s||''}${c.f?' calc':''}${c.hl?' hl':''}">${c.l}</th>`).join('')}</tr>`;
  let b=ps.map(p=>{const o=P_(p.id);
    return `<tr><td class="nr">${esc(p.nr)}</td><td class="nm">${esc(p.name)}</td>`+cols.map(c=>c.f?`<td class="calc">${c.f(o)}</td>`:
      edit?`<td class="c"><div class="cc"><button class="pl" data-s="${sec}" data-p="${p.id}" data-k="${c.k}" data-d="1">+</button><button class="mi" data-s="${sec}" data-p="${p.id}" data-k="${c.k}" data-d="-1">−</button><b>${v(o,c.k)}</b></div></td>`
      :`<td class="ro${c.hl?' hl':''}${c.hl&&v(o,c.k)?' hlx':''}">${v(o,c.k)}</td>`).join('')+'</tr>'}).join('');
  if(!ps.length)b=`<tr><td class="empty" colspan="${cols.length+2}">Noch keine ${sec==='g'?'Torhüter':'Feldspieler'} für dieses Spiel ausgewählt. ${edit?'Im Reiter „Kader“ anhaken oder unten hinzufügen.':''}</td></tr>`;
  b+=`<tr class="tot"><td></td><td class="nm">Gesamt</td>`+cols.map(c=>c.f?`<td class="calc">${c.f(tot)}</td>`:`<td class="${c.hl?'hl':''}">${tot[c.k]||0}</td>`).join('')+'</tr>';
  return `<div class="wrap"><table>${cg}<thead>${hd}</thead><tbody>${b}</tbody></table></div>`;
}

const FS=[['Sp.',(s,n)=>n,0],['Tore',s=>v(s,'t'),0],['Würfe',s=>v(s,'w'),0],[`Wurf${SH}quote`,s=>q(v(s,'t'),v(s,'w')),1],
 ['7m Tore / Würfe',s=>v(s,'t7')+'/'+v(s,'w7'),0],['7m-Quote',s=>q(v(s,'t7'),v(s,'w7')),1],[`Gegen${SH}stoß verwor${SH}fen`,s=>v(s,'gv'),0,1],['Assists',s=>v(s,'as'),0],
 [`Tech${SH}nische Fehler`,s=>v(s,'tf'),0],[`Pass-/ Fang${SH}fehler`,s=>v(s,'pf'),0],[`7m heraus${SH}geholt`,s=>v(s,'h7'),0],
 [`1:1 gewon${SH}nen`,s=>v(s,'e1'),0],[`2 Min heraus${SH}geholt`,s=>v(s,'h2'),0],['Angriff +/−',s=>angr(s),1],['Ø Angriff',(s,n)=>avg(angr(s),n),1],
 ['Steals',s=>v(s,'st'),0],['Blocks',s=>v(s,'bl'),0],['2 Min erhalten',s=>v(s,'z2'),0],['Abwehr +/−',s=>abw(s),1],['Ø Abwehr',(s,n)=>avg(abw(s),n),1]];
const GS=[['Sp.',(s,n)=>n,0],['Gehalten',s=>v(s,'h'),0],[`Gegen${SH}treffer`,s=>v(s,'g'),0],['Abwehr-Quote',s=>q(v(s,'h'),v(s,'h')+v(s,'g')),1],
 ['7m gehalten / 7m',s=>v(s,'h7')+'/'+v(s,'s7'),0],['7m-Quote',s=>q(v(s,'h7'),v(s,'s7')),1],['Assists',s=>v(s,'as'),0],[`Fehl${SH}pässe`,s=>v(s,'fp'),0]];
function seasons(){return [...new Set(S.archiv.map(seasonOf))].sort().reverse()}
function agg(){
  const gs=S.archiv.filter(g=>S.season==='alle'||seasonOf(g)===S.season).sort((a,b)=>gDate(a).localeCompare(gDate(b)));
  const F={},K={},add=(t,o)=>{for(const k in o||{})t[k]=(t[k]||0)+(o[k]||0)};
  gs.forEach(g=>{g.fp.forEach(id=>{const r=F[id]||(F[id]={id,n:0,s:{}});r.n++;r.name=pn(g,id);r.nr=pnr(g,id);add(r.s,g.a[id]);add(r.s,g.d[id])});
    g.gk.forEach(id=>{const r=K[id]||(K[id]={id,n:0,s:{}});r.n++;r.name=pn(g,id);r.nr=pnr(g,id);add(r.s,g.g[id])})});
  const tot=R=>{const s={};R.forEach(r=>add(s,r.s));return s};
  const fl=Object.values(F).sort(nrSort),kl=Object.values(K).sort(nrSort);
  return{games:gs.length,F:fl,K:kl,tF:tot(fl),tK:tot(kl)};
}
function seasonRows(def,list,ts,games){return{hd:['Nr','Spieler',...def.map(d=>d[0])],calc:new Set(def.map((d,i)=>d[2]?i+2:-1)),hl:new Set(def.map((d,i)=>d[3]?i+2:-1)),
  rows:[...list.map(r=>[r.nr,r.name,...def.map(d=>d[1](r.s,r.n))]),['','Mannschaft',...def.map(d=>d[1](ts,games))]]}}
function htmlTable(t){
  const cg=`<colgroup><col class="nr"><col class="nm">${t.hd.slice(2).map(()=>'<col>').join('')}</colgroup>`;
  return `<div class="wrap"><table class="st">${cg}<thead><tr>${t.hd.map((h,i)=>`<th class="${t.calc.has(i)?'calc':''}${t.hl&&t.hl.has(i)?' hl':''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>`
    +t.rows.map((r,ri)=>`<tr class="${ri===t.rows.length-1?'tot':''}">`+r.map((c,i)=>`<td class="${i===1?'nm':i===0?'nr':''}${t.calc.has(i)?' calc':''}${t.hl&&t.hl.has(i)?' hl'+(c&&c!=='0'&&ri<t.rows.length-1?' hlx':''):''}">${esc(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>';
}
function drawSaison(T){
  if(!S.archiv.length){T.innerHTML='<p class="hint">Noch keine gespeicherten Spiele. Nach dem Spiel auf „Spiel speichern“ tippen, dann erscheinen die Werte hier.</p>';return}
  const ss=seasons();if(S.season!=='alle'&&!ss.includes(S.season))S.season='alle';
  const A=agg();
  T.innerHTML=`<div class="bar"><label style="flex-direction:row;align-items:center;gap:8px">Saison <select id="ssel"><option value="alle">Alle Spiele</option>${ss.map(s=>`<option ${S.season===s?'selected':''}>${s}</option>`).join('')}</select></label>
    <b>${A.games} Spiel${A.games===1?'':'e'}</b><span class="sp"></span><button data-act="spdf">Saison als PDF</button></div>
    <h3>Feldspieler</h3>${isPhone()?cardsFrom(seasonRows(FS,A.F,A.tF,A.games),[2,3,5,8,16,21]):htmlTable(seasonRows(FS,A.F,A.tF,A.games))}<h3>Torhüter</h3>${isPhone()?cardsFrom(seasonRows(GS,A.K,A.tK,A.games),[2,3,4,5]):htmlTable(seasonRows(GS,A.K,A.tK,A.games))}
    <p class="hint">Saison = Juli bis Juni, nach dem Spieldatum. Ø = pro Spiel, in dem der Spieler dabei war.</p>`;
  document.getElementById('ssel').onchange=e=>{S.season=e.target.value;save();draw()};
}

// ---------- Dateien speichern / teilen ----------
const PL={};
function plug(n){const C=window.Capacitor;if(!C)return null;
  if(!PL[n])PL[n]=(C.Plugins&&C.Plugins[n])||(C.registerPlugin&&C.registerPlugin(n))||{};return PL[n]}
function nat(n,m,o){const p=plug(n);if(p&&typeof p[m]==='function')return p[m](o);return window.Capacitor.nativePromise(n,m,o)}
const isApp=()=>{const C=window.Capacitor;return !!(C&&(C.isNativePlatform?C.isNativePlatform():C.getPlatform&&C.getPlatform()!=='web'))};
function b64(by){let s='';for(let i=0;i<by.length;i+=0x8000)s+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(s)}
const safe=s=>s.replace(/[^\w.-]+/g,'_');
async function saveFile(nm,by,mime){
  try{
    if(isApp()){const r=await nat('Filesystem','writeFile',{path:nm,data:b64(by),directory:'CACHE'});
      try{await nat('Share','share',{title:nm,files:[r.uri],dialogTitle:'Speichern oder teilen'})}
      catch(x){if(/cancel/i.test(String(x&&x.message||x)))return false;await nat('Share','share',{title:nm,url:r.uri,dialogTitle:'Speichern oder teilen'})}
      return true}
    // Handy/Tablet im Browser (z. B. iPhone/iPad): Teilen-Menü statt Download
    if(window.matchMedia('(pointer: coarse)').matches&&navigator.canShare){const f=new File([by],nm,{type:mime});
      if(navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:nm});return true}catch(x){if(/abort|cancel/i.test(String(x&&x.name||x)))return false}}}
    const u=URL.createObjectURL(new Blob([by],{type:mime})),a=document.createElement('a');
    a.href=u;a.download=nm;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return true;
  }catch(e){if(!/cancel/i.test(String(e&&e.message||e)))alert('Export fehlgeschlagen: '+((e&&e.message)||e));return false}
}

function saveGame(){
  if(!hasData(S.cur)){toast('Noch keine Daten – nichts zu speichern');return}
  const g=clone(S.cur),old=g.players||{};g.players={};
  {const [o1,o2]=score(g,'all'),[a1,a2]=score(g,'1');if(!g.h.erg){g.h.erg=`${o1}:${o2}`;g.ergAuto=true}else if(!g.ergAuto)delete g.ergAuto;if(!g.h.hz&&hasH2(g)){g.h.hz=`${a1}:${a2}`;g.hzAuto=true}else if(!g.hzAuto)delete g.hzAuto;}
  [...g.fp,...g.gk].forEach(id=>{const p=kp(id);g.players[id]={name:p?p.name:(old[id]?old[id].name:'?'),nr:p?p.nr:(old[id]?old[id].nr:'')}});
  g.savedAt=Date.now();if(S.user)g.von=S.user;delete g.sent;const i=S.archiv.findIndex(x=>x.id===g.id);if(i>=0)S.archiv[i]=g;else S.archiv.push(g);
  S.cur=newGame(S.cur.fp,S.cur.gk);S.undo=[];S.last='';S.hf='all';save();render();toast(i>=0?'Änderungen gespeichert':'Spiel gespeichert – zu finden unter „Historie“');
  autoBackup();
  if(S.role==='erf')openSheet({t:'sent',id:g.id});
}
function addPlayer(name,nr,r,today){name=(name||'').trim();if(!name){toast('Bitte einen Namen eingeben');return false}
  const id=uid();S.kader.push({id,name,nr:(nr||'').trim(),r});if(today)S.cur[r==='g'?'gk':'fp'].push(id);save();return true}

async function autoBackup(){
  if(!isApp())return;
  const txt=JSON.stringify({format:'spielauswertung',version:2,exportiert:new Date().toISOString(),kader:S.kader,archiv:S.archiv});
  const day=new Date().toISOString().slice(0,10),files=['Spielauswertung/Spielauswertung_Sicherung_aktuell.json',`Spielauswertung/Spielauswertung_Sicherung_${day}.json`];
  for(const [dir,where] of [['DOCUMENTS','Dokumente/Spielauswertung'],['EXTERNAL','App-Ordner (Android/data/…/files/Spielauswertung) – wird beim Deinstallieren gelöscht']]){
    try{for(const f of files)await nat('Filesystem','writeFile',{path:f,data:txt,directory:dir,encoding:'utf8',recursive:true});
      S.autoB={t:Date.now(),w:where,ok:dir==='DOCUMENTS'};save();if(S.tab==='hist')draw();return}catch(e){}
  }
  S.autoB={t:Date.now(),w:'fehlgeschlagen',ok:false};save();toast('Automatische Sicherung fehlgeschlagen – bitte „Sicherung exportieren“ nutzen');
}
function exportBackup(){const data={format:'spielauswertung',version:2,exportiert:new Date().toISOString(),kader:S.kader,archiv:S.archiv};

// Import (Sicherung oder gesendetes Spiel). Spieler werden über die Kennung oder über Name + Nummer zugeordnet.
function remapInGame(g,o,n){if(!g||o===n)return;['fp','gk'].forEach(k=>{if(g[k])g[k]=[...new Set(g[k].map(x=>x===o?n:x))]});
  ['a','d','g'].forEach(s=>{if(g[s]&&g[s][o]){g[s][n]=g[s][o];delete g[s][o]}});
  if(g.h2)['a','d','g'].forEach(s=>{const T=g.h2[s];if(T&&T[o]){T[n]=T[o];delete T[o]}});
  if(g.players&&g.players[o]){g.players[n]=g.players[o];delete g.players[o]}}
function importData(d,c){const norm=x=>String(x||'').trim().toLowerCase(),map={};
  (d.kader||[]).forEach(p=>{if(!p||!p.id)return;if(kp(p.id))return;
    const twin=S.kader.find(x=>norm(x.name)===norm(p.name)&&norm(x.nr)===norm(p.nr));
    if(twin){map[p.id]=twin.id;c.m++}else{S.kader.push({id:p.id,name:p.name,nr:p.nr||'',r:p.r==='g'?'g':'f'});c.k++}});
  d.archiv.forEach(g0=>{if(!g0||!g0.id)return;const g=clone(g0);for(const o in map)remapInGame(g,o,map[o]);delete g.sent;
    const i=S.archiv.findIndex(x=>x.id===g.id);
    if(i<0){S.archiv.push(g);c.n++}else if((g.savedAt||0)>(S.archiv[i].savedAt||0)){S.archiv[i]=g;c.u++}else c.s++})}
async function importFiles(files){const c={n:0,u:0,s:0,k:0,m:0,bad:0};
  for(const f of files){let d=null;try{d=JSON.parse(await f.text())}catch(e){}
    if(!d||d.format!=='spielauswertung'||!Array.isArray(d.archiv)){c.bad++;continue}importData(d,c)}
  save();render();if(c.n||c.u||c.k)autoBackup();
  const parts=[`${c.n} Spiel${c.n===1?'':'e'} neu`];if(c.u)parts.push(`${c.u} aktualisiert`);if(c.s)parts.push(`${c.s} schon vorhanden`);
  if(c.k)parts.push(`${c.k} Spieler neu`);if(c.m)parts.push(`${c.m} Spieler zugeordnet`);if(c.bad)parts.push(`${c.bad} Datei${c.bad===1?'':'en'} nicht lesbar`);
  toast('Importiert: '+parts.join(', '))}
function importBackup(txt){let d;try{d=JSON.parse(txt)}catch(e){alert('Die Datei ist keine gültige Sicherung.');return}
  if(!d||d.format!=='spielauswertung'||!Array.isArray(d.archiv)){alert('Die Datei ist keine Sicherung der Spielauswertung.');return}
  const c={n:0,u:0,s:0,k:0,m:0};importData(d,c);save();render();autoBackup();
  toast(`Importiert: ${c.n} Spiele neu${c.u?', '+c.u+' aktualisiert':''}, ${c.k} Spieler neu`)}

// Zählen: verändert Gesamtwert und (in der 2. HZ) den Anteil der 2. Halbzeit; merkt sich die echten Änderungen fürs Rückgängigmachen
function bump(g,sec,pid,k,d,ch){g[sec]=g[sec]||{};const o=g[sec][pid]||(g[sec][pid]={});const b=v(o,k),a=Math.max(0,b+d),dt=a-b;if(!dt)return;o[k]=a;
  g.h2=g.h2||{};const T=g.h2[sec]||(g.h2[sec]={}),q=T[pid]||(T[pid]={}),b2=v(q,k);let a2=b2;
  if((g.half||1)===2)a2=Math.max(0,b2+dt);if(a2>a)a2=a;const dh=a2-b2;if(dh)q[k]=a2;ch.push({sec,pid,k,dt,dh})}
function pushUndo(ch,label){S.undo=S.undo||[];S.undo.push({gid:S.cur.id,ch,label});if(S.undo.length>200)S.undo.shift()}
function undo(){const u=(S.undo||[]).pop();if(!u)return;if(u.gid!==S.cur.id){S.undo=[];render();return}
  const g=S.cur;u.ch.slice().reverse().forEach(c=>{
    if(c.tl){g.tl=g.tl||[];if(c.tl==='add')g.tl.pop();else g.tl.splice(c.i,0,c.e);return}
    const o=g[c.sec][c.pid];o[c.k]=Math.max(0,v(o,c.k)-c.dt);
    if(c.dh){const q=g.h2[c.sec][c.pid];q[c.k]=Math.max(0,v(q,c.k)-c.dh)}});
  S.last='Zurückgenommen: '+u.label;save();render();toast('Zurückgenommen: '+u.label)}

  if(d.ko){const p=kp(d.ko);if(!p)return;const was=c.fp.includes(p.id)||c.gk.includes(p.id);p.r=x.value;
    c.fp=c.fp.filter(i=>i!==p.id);c.gk=c.gk.filter(i=>i!==p.id);if(was)c[p.r==='g'?'gk':'fp'].push(p.id);save();render()}
  if(d.kn||d.kr)render();
});
